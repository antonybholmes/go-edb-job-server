app:
  url: https://crispr.rdf-lab.org
  domain: crispr.rdf-lab.org
  logFile: logs/app.log
  port: "0.0.0.0:8082"
  trustedProxies:
    - 127.0.0.1
    - ::1
  maxBodyBytes: 104857600
  pollIntervalSeconds: 10
  email:
    from: "Experiments Team <donotreply@rdf-lab.org>"

cors:
  allowOrigins:
    - http://localhost:3000
    - http://localhost:8000
    - https://crispr.rdf-lab.org

  allowMethods:
    - GET
    - POST
    - PUT
    - DELETE
  allowHeaders:
    - Origin
    - Content-Type
    - Authorization
    - X-CSRF-Token
  allowCredentials: true
  maxAge: 43200

aws:
  s3:
    folder: "jobs/"
  sqs:
    threads: 5
    waitTimeSecs: 10
    maxReceiveCount: 5
files:
  tmp: ./data/tmp/jobs/users/
